<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360"><rect width="960" height="360" fill="#f8fafc"/><g font-family="Microsoft YaHei,sans-serif" fill="#25405a"><text x="35" y="40" font-size="24">Day2 隔离运行复核 · 2026-10-24</text><text x="35" y="72" font-size="15">固定main 524337e；PGlite + 本机HTTP + 合成输入；不代表正式部署/浏览器验收</text><rect x="35" y="100" width="270" height="115" rx="12" fill="#e1f0e8"/><text x="60" y="145" font-size="23">后端既有套件 40 / 40</text><text x="60" y="182">前端适配器 5 / 5</text><rect x="325" y="100" width="270" height="115" rx="12" fill="#e3edf8"/><text x="350" y="145" font-size="23">HTTP核心冒烟 2 / 2</text><text x="350" y="182">注册、登录、资料、退出</text><rect x="615" y="100" width="310" height="115" rx="12" fill="#f8e3e9"/><text x="640" y="145" font-size="23">额外契约复核 6项失败</text><text x="640" y="182">错误映射、幂等、续期、边界</text><text x="35" y="255">不同检查范围分别统计；不将40项、5项与2项解释为47条独立端到端场景。</text><text x="35" y="288">此图由真实日志/探针结果生成，是测试结果摘要；不是产品页面或会议截图。</text><text x="35" y="325" font-size="14">结论：隔离正向链可运行；额外失败阻止整体验收；复现命令与原始结果随包提供。</text></g></svg>
