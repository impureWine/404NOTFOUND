<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none';" />
    <title>404NOTFOUND 桌宠入口</title>
    <link rel="stylesheet" href="./renderer.css" />
  </head>
  <body>
    <main class="pet-shell">
      <header class="pet-titlebar">
        <span class="pet-brand"><span class="pet-mark">4</span><span><strong>NOTFOUND</strong><small>桌面宠物</small></span></span>
        <span class="drag-hint">拖动窗口</span>
        <div class="window-actions"><button type="button" class="window-button" data-action="hide" aria-label="隐藏桌宠">−</button><button type="button" class="window-button close" data-action="close" aria-label="关闭桌宠">×</button></div>
      </header>
      <section class="pet-card">
        <div class="pet-orb" aria-hidden="true"><span>☁</span></div>
        <div class="pet-copy"><span class="eyebrow">桌面陪伴</span><h1>先停一下，也可以。</h1><p>打开工作台使用陪伴与记录。桌宠支持置顶、拖动、隐藏和点击穿透。</p></div>
      </section>
      <button type="button" class="control-button" data-action="open-workspace">打开工作台</button><button type="button" class="control-button" data-action="open-pressure">打开桌面发泄浮层（Esc 退出）</button>
      <section class="pet-controls" aria-label="窗口控制">
        <button type="button" class="control-button" data-action="click-through" aria-pressed="false"><span class="control-dot"></span><span><strong>点击穿透</strong><small>允许鼠标点击下方窗口</small></span></button>
        <span class="status" role="status" data-status>普通交互模式</span>
      </section>
      <p class="pet-footnote">隐藏会停止本窗口。点击穿透后，按 Alt+Shift+P 恢复操作。</p>
    </main>
    <script src="./renderer.js"></script>
  </body>
</html>
