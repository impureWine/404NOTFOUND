<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none';" />
    <title>404NOTFOUND 桌宠入口</title>
    <link rel="stylesheet" href="./renderer.css" />
  </head>
  <body>
    <main class="pet-shell">
      <div class="pet-drag-zone" aria-label="拖动桌宠窗口"></div>
      <div class="pet-avatar" aria-hidden="true"><img src="./assets/pet-mascot.png" alt="" /></div>
      <section class="pet-toolbar" aria-label="桌宠快捷操作">
        <button type="button" class="tool-button" data-action="open-workspace" aria-label="打开工作台" title="打开工作台"><span class="tool-glyph compose-glyph"></span></button>
        <span class="tool-divider" aria-hidden="true"></span>
        <button type="button" class="tool-button" data-action="open-pressure" aria-label="打开桌面发泄浮层" title="打开桌面发泄浮层"><span class="tool-glyph wave-glyph"><i></i><i></i><i></i></span></button>
      </section>
      <div class="pet-window-actions" aria-label="窗口操作">
        <button type="button" class="window-button pass-window-button" data-action="click-through" aria-label="点击穿透" title="点击穿透" aria-pressed="false">◌</button>
        <button type="button" class="window-button" data-action="hide" aria-label="隐藏桌宠">−</button>
        <button type="button" class="window-button close" data-action="close" aria-label="关闭桌宠">×</button>
      </div>
      <p class="pet-footnote" role="status" data-status>点击图标打开功能 · 拖动桌宠移动窗口</p>
    </main>
    <script src="./renderer.js"></script>
  </body>
</html>
