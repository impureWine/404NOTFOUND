<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1040" viewBox="0 0 1500 1040">
  <title>404NOTFOUND 数据库 ER 图</title>
  <desc>持久化实体、主键和主要关系。文字销毁正文、普通消息和检索中间结果不入图。</desc>
  <style>
    .box{fill:#f7fbff;stroke:#1f4e79;stroke-width:2}.head{fill:#1f4e79}.t{font:14px Arial,'Microsoft YaHei',sans-serif;fill:#17202a}.ht{font:bold 15px Arial,'Microsoft YaHei',sans-serif;fill:#fff}.rel{stroke:#566573;stroke-width:2;fill:none}.note{fill:#fff7df;stroke:#b9770e;stroke-width:2}.nt{font:13px Arial,'Microsoft YaHei',sans-serif;fill:#6e4b00}
  </style>
  <rect x="0" y="0" width="1500" height="1040" fill="#ffffff"/>
  <text x="45" y="42" class="t" style="font-size:24px;font-weight:bold">404NOTFOUND 数据库 ER 图（设计基线）</text>
  <text x="45" y="68" class="t">账号 + 入口隔离；仅主动保存数据持久化；REQ15 文字销毁严格不入库</text>

  <g transform="translate(45,105)"><rect class="box" width="300" height="160" rx="4"/><rect class="head" width="300" height="30"/><text class="ht" x="12" y="21">USER_ACCOUNT</text><text class="t" x="12" y="55">PK id uuid</text><text class="t" x="12" y="78">UQ login_identifier_normalized</text><text class="t" x="12" y="101">password_hash varchar(255)</text><text class="t" x="12" y="124">status / created_at</text></g>
  <g transform="translate(410,105)"><rect class="box" width="270" height="135" rx="4"/><rect class="head" width="270" height="30"/><text class="ht" x="12" y="21">USER_PROFILE</text><text class="t" x="12" y="55">PK id uuid</text><text class="t" x="12" y="78">FK user_id (unique)</text><text class="t" x="12" y="101">nickname / bio_ciphertext</text></g>
  <g transform="translate(760,105)"><rect class="box" width="270" height="135" rx="4"/><rect class="head" width="270" height="30"/><text class="ht" x="12" y="21">ENTRY_POINT</text><text class="t" x="12" y="55">PK id uuid</text><text class="t" x="12" y="78">UQ code</text><text class="t" x="12" y="101">capability_state jsonb</text></g>
  <g transform="translate(1110,105)"><rect class="box" width="300" height="160" rx="4"/><rect class="head" width="300" height="30"/><text class="ht" x="12" y="21">AUTH_SESSION</text><text class="t" x="12" y="55">PK id / FK user_id</text><text class="t" x="12" y="78">FK entry_point_id</text><text class="t" x="12" y="101">token_hash / expires_at</text><text class="t" x="12" y="124">revoked_at</text></g>

  <g transform="translate(45,335)"><rect class="box" width="300" height="150" rx="4"/><rect class="head" width="300" height="30"/><text class="ht" x="12" y="21">CONVERSATION</text><text class="t" x="12" y="55">PK id / FK owner_user_id</text><text class="t" x="12" y="78">FK entry_point_id</text><text class="t" x="12" y="101">mode / content_ciphertext</text><text class="t" x="12" y="124">version_no / deleted_at</text></g>
  <g transform="translate(410,335)"><rect class="box" width="300" height="150" rx="4"/><rect class="head" width="300" height="30"/><text class="ht" x="12" y="21">EMOTION_RECORD</text><text class="t" x="12" y="55">PK id / FK owner_user_id</text><text class="t" x="12" y="78">FK entry_point_id</text><text class="t" x="12" y="101">record_date / emotion_code</text><text class="t" x="12" y="124">intensity 1..5</text></g>
  <g transform="translate(775,335)"><rect class="box" width="300" height="150" rx="4"/><rect class="head" width="300" height="30"/><text class="ht" x="12" y="21">WORRY_OBJECT</text><text class="t" x="12" y="55">PK id / FK owner_user_id</text><text class="t" x="12" y="78">FK entry_point_id</text><text class="t" x="12" y="101">shape_code</text><text class="t" x="12" y="124">title/body_ciphertext</text></g>
  <g transform="translate(1140,335)"><rect class="box" width="300" height="150" rx="4"/><rect class="head" width="300" height="30"/><text class="ht" x="12" y="21">STORED_CONCERN</text><text class="t" x="12" y="55">PK id / FK owner_user_id</text><text class="t" x="12" y="78">FK entry_point_id</text><text class="t" x="12" y="101">reopen_at / status</text><text class="t" x="12" y="124">body_ciphertext</text></g>

  <g transform="translate(45,575)"><rect class="box" width="300" height="150" rx="4"/><rect class="head" width="300" height="30"/><text class="ht" x="12" y="21">SAVED_QUERY</text><text class="t" x="12" y="55">PK id / FK owner_user_id</text><text class="t" x="12" y="78">FK entry_point_id</text><text class="t" x="12" y="101">raw/normalized_ciphertext</text><text class="t" x="12" y="124">status / uncertainty_note</text></g>
  <g transform="translate(410,575)"><rect class="box" width="260" height="135" rx="4"/><rect class="head" width="260" height="30"/><text class="ht" x="12" y="21">CLAIM</text><text class="t" x="12" y="55">PK id / FK saved_query_id</text><text class="t" x="12" y="78">claim_text_ciphertext</text><text class="t" x="12" y="101">status</text></g>
  <g transform="translate(740,575)"><rect class="box" width="260" height="135" rx="4"/><rect class="head" width="260" height="30"/><text class="ht" x="12" y="21">SOURCE</text><text class="t" x="12" y="55">PK id / UQ canonical_url</text><text class="t" x="12" y="78">source_tier / title</text><text class="t" x="12" y="101">published/retrieved_at</text></g>
  <g transform="translate(1070,575)"><rect class="box" width="300" height="135" rx="4"/><rect class="head" width="300" height="30"/><text class="ht" x="12" y="21">EVIDENCE</text><text class="t" x="12" y="55">PK (claim_id, source_id)</text><text class="t" x="12" y="78">relation</text><text class="t" x="12" y="101">supports/conflicts/context</text></g>

  <g transform="translate(45,805)"><rect class="box" width="320" height="150" rx="4"/><rect class="head" width="320" height="30"/><text class="ht" x="12" y="21">CONSENT_RECORD</text><text class="t" x="12" y="55">PK id / FK user_id</text><text class="t" x="12" y="78">source/target_entry_point_id</text><text class="t" x="12" y="101">purpose / scope</text><text class="t" x="12" y="124">expires_at / revoked_at</text></g>
  <g transform="translate(420,805)"><rect class="box" width="320" height="150" rx="4"/><rect class="head" width="320" height="30"/><text class="ht" x="12" y="21">DELETION_JOB</text><text class="t" x="12" y="55">PK id / FK owner_user_id</text><text class="t" x="12" y="78">status / requested_at</text><text class="t" x="12" y="101">DELETION_TARGET 1:N</text><text class="t" x="12" y="124">retryable propagation</text></g>
  <g transform="translate(795,805)"><rect class="note" width="595" height="150" rx="4"/><text class="nt" x="15" y="28" style="font-weight:bold">明确不入库</text><text class="nt" x="15" y="58">REQ15 文字销毁正文 / 普通未保存 Message / 检索中间结果</text><text class="nt" x="15" y="88">不进入数据库、浏览器持久缓存、日志、模型、搜索或备份。</text><text class="nt" x="15" y="118">REQ13 漂流瓶、公开主页、密码找回/重置表属于本次排除范围。</text></g>

  <path class="rel" d="M345 180 L410 180"/><path class="rel" d="M680 180 L760 180"/><path class="rel" d="M1030 180 L1110 180"/>
  <path class="rel" d="M195 265 L195 335"/><path class="rel" d="M540 240 L540 335"/><path class="rel" d="M895 240 L895 335"/><path class="rel" d="M1260 265 L1260 335"/>
  <path class="rel" d="M195 485 L195 575"/><path class="rel" d="M560 485 L560 575"/><path class="rel" d="M895 485 L870 575"/><path class="rel" d="M1260 485 L1220 575"/>
  <path class="rel" d="M345 650 L410 650"/><path class="rel" d="M670 650 L740 650"/><path class="rel" d="M1000 650 L1070 650"/>
  <path class="rel" d="M195 485 L195 805"/><path class="rel" d="M245 265 L245 805"/>
  <text x="45" y="1000" class="t">图例：蓝色实体为持久化表；黄色区域为明确排除/临时数据。关系线表示主要外键方向，完整约束以 DDL 为准。</text>
</svg>
